[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "3.0.0"
description = "Cross-platform synthetic identity, fingerprint, and card testing toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Amen", email = "amen@kancalabs.my.id" }
]
dependencies = [
    "curl_cffi>=0.17.0",
]

[project.scripts]
forge = "forge.cli.main:main"

[tool.setuptools.packages.find]
include = ["forge*"]
